<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICA 대화 장면 분석기</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#d9dde3;--ink:#1d2330;--mut:#667085;--ok:#1f8a4c;--bad:#c62828;--est:#b26a00;--none:#9aa3b2;--blue:#1d5fd0}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0}
input[type=datetime-local],select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;font:inherit}
button{font:inherit;padding:4px 10px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
button:hover{background:#eef2f9}button:disabled{opacity:.5;cursor:default}
#tally{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap}
.tile{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-width:120px}
.tile b{font-size:20px;display:block}.tile span{color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:minmax(340px,38%) 1fr;gap:12px;padding:0 16px 24px}
#left,#right{background:var(--card);border:1px solid var(--line);border-radius:6px;min-height:200px}
#left{max-height:calc(100vh - 170px);overflow:auto}
#filters{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:#fff}
.chip{border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px;cursor:pointer;background:#fff}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{padding:8px 10px;border-bottom:1px solid #eceff3;cursor:pointer}.row:hover{background:#f6f8fc}.row.sel{background:#e8f0fe}
.row .t{color:var(--mut);font-size:12px}.row .u{margin:2px 0}
.badge{display:inline-block;border-radius:3px;padding:0 6px;font-size:12px;margin:1px 3px 1px 0;color:#fff}
.s-확정{background:var(--bad)}.s-추정{background:var(--est)}.s-정상{background:var(--ok)}.s-미분류{background:var(--none)}.s-확인{background:#7a4fc0}
#right{padding:12px 16px}
.sec{margin:14px 0 6px;font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fafbfc}
.box h4{margin:0 0 4px;font-size:13px;color:var(--mut)}
.silent{background:#fff3cd;border:2px solid #e0a800;border-radius:6px;padding:10px 14px;font-size:20px;font-weight:700;margin:8px 0}
.cause{border-left:4px solid var(--bad);padding:4px 10px;margin:6px 0;background:#fafbfc}
.cause.추정{border-color:var(--est)}.cause.정상{border-color:var(--ok)}.cause.미분류{border-color:var(--none)}.cause.확인{border-color:#7a4fc0}
.ev{font:12px ui-monospace,monospace;color:#444;word-break:break-all}
#strip{display:flex;gap:4px}
.stage{flex:1;border-radius:4px;padding:6px 4px;text-align:center;font-size:12px;color:#fff;min-width:0}
.stage small{display:block;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-pass{background:var(--ok)}.st-broken{background:var(--bad)}.st-estimate{background:var(--est)}.st-none{background:var(--none)}
.lane{display:grid;grid-template-columns:52px 1fr;gap:6px;border-top:1px solid #eceff3;padding:3px 0}
.lane .n{color:var(--mut);font-weight:700}
.note{color:var(--mut);font-size:12px}
details{margin-top:8px}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}
.err{color:var(--bad)}
.clipr{margin:3px 0}
</style></head><body>
<header><h1>대화 장면 분석기</h1>
<label>부터 <input type="datetime-local" id="since"></label>
<label>까지 <input type="datetime-local" id="until"></label>
<button id="load">불러오기</button><span id="status" class="note"></span></header>
<div id="tally"></div>
<main><div id="left"><div id="filters"></div><div id="list"></div></div>
<div id="right"><span class="note">왼쪽에서 장면을 고르세요.</span></div></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const fmtT=t=>{const d=new Date(t*1000);return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};
const local=t=>{const d=new Date(t*1000);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const sKey=s=>s==="확인 필요"?"확인":s;
const COST={midm:"로컬 Mi:dm — 비용 없음, 주행 중이면 거부",gpt:"외부 API(gpt) — 비용 발생",realtime:"외부 API(Realtime, 저장 클립) — 비용 발생"};
let data=null,sel=null,activeCauses=new Set(),showNormal=false;
const q=()=>`since=${encodeURIComponent($("since").value)}&until=${encodeURIComponent($("until").value)}`;
async function j(url,opt){const r=await fetch(url,opt);let b;try{b=await r.json()}catch(e){b={error:"응답 해석 실패"}};if(!r.ok){const e=new Error(b.error||r.status);e.body=b;e.code=r.status;throw e}return b}

async function load(){
  $("status").textContent="분석 중…(처음엔 수십 초)";$("load").disabled=true;
  try{data=await j("/api/scenes?"+q());
    $("status").textContent=`사건 ${data.n_events}개`;renderTally();renderFilters();renderList();
  }catch(e){$("status").innerHTML=`<span class=err>${esc(e.message)}</span>`}
  $("load").disabled=false}
function renderTally(){const t=data.tally;
  const tiles=[[t.wake_fire,"호출 확정"],[t.wake_near_over,`호출 놓침 (문턱 이상) · 그중 확정 직후 ${t.wake_near_over_after_fire}`],
   [t.ghost,`작아서 버림 · 질문 창 ${t.ghost_followup} / 호출 뒤 ${t.ghost_after_wake}`],[t.relisten_drop,"재청취 기각"],
   [t.overlap,"질문 겹침"],[t.flagged.length,"표시된 장면 수"]];
  $("tally").innerHTML=tiles.map(([n,l])=>`<div class=tile><b>${n}</b><span>${esc(l)}</span></div>`).join("")}
function renderFilters(){
  const names=data.cause_names.filter(n=>!n.startsWith("정상"));
  $("filters").innerHTML=`<span class=chip id=cnormal>${showNormal?"정상 장면 포함":"정상 장면 숨김"}</span>`+
    names.map(n=>`<span class="chip ${activeCauses.has(n)?"on":""}" data-n="${esc(n)}">${esc(n)}</span>`).join("");
  $("cnormal").onclick=()=>{showNormal=!showNormal;renderFilters();renderList()};
  $("filters").querySelectorAll("[data-n]").forEach(c=>c.onclick=()=>{const n=c.dataset.n;activeCauses.has(n)?activeCauses.delete(n):activeCauses.add(n);renderFilters();renderList()})}
function renderList(){
  let rows=data.scenes.filter(s=>showNormal||s.flagged);
  if(activeCauses.size)rows=rows.filter(s=>s.causes.some(c=>activeCauses.has(c.name)));
  $("list").innerHTML=rows.map(s=>`<div class="row ${sel===s.id?"sel":""}" data-id="${esc(s.id)}"><div class=t>${fmtT(s.start)} · ${s.trigger==="wake"?"호출":"질문"}</div>
   <div class=u>${s.user_text?esc(s.user_text):'<span class=note>(받아쓴 말 없음)</span>'}</div>
   ${s.causes.filter(c=>showNormal||c.status!=="정상").map(c=>`<span class="badge s-${sKey(c.status)}">${esc(c.name)} · ${esc(c.status)}</span>`).join("")}</div>`).join("")||'<div class=row><span class=note>해당 장면 없음</span></div>';
  $("list").querySelectorAll(".row[data-id]").forEach(r=>r.onclick=()=>open(r.dataset.id))}
async function open(id){sel=id;renderList();$("right").innerHTML='<span class=note>불러오는 중… (설계상 대답 계산에 몇 초)</span>';
  try{const d=await j(`/api/scene/${encodeURIComponent(id)}?${q()}`);renderScene(d)}catch(e){$("right").innerHTML=`<span class=err>${esc(e.message)}</span>`}}
function expBox(e){if(!e)return '<div class=note>코드 규칙이 정하지 않음 — LLM 이 정하는 말(아래 다시 묻기)</div>';
  return `<div><b>${esc(e.sentence||"(문장 표 없음)")}</b></div><div class=note>의도 ${esc(e.intent||"-")} · ${esc(e.by)}${e.reply&&e.reply!==e.sentence?` · reply: ${esc(e.reply)}`:""}</div><div class=note>${esc(e.note||"")}</div>`}
function renderScene(d){
  const rule=d.expected.rule;
  const reasked=Object.entries(d.expected.reasked).map(([p,e])=>`<div class=clipr><b>${esc(p)}</b> ${expBox(e)}</div>`).join("");
  const actual=d.robot.length?d.robot.map(r=>`<div>+${(r.t-d.start).toFixed(1)}s <span class=note>${esc(r.src)}${r.priority?"["+esc(r.priority)+"]":""}</span> ${esc(r.text)}</div>`).join(""):'<div class=note>이 장면에서 로봇이 한 말 없음</div>';
  const then=d.expected.path_then;
  const btns=d.expected.paths.map(p=>`<button data-p="${p}" title="${esc(COST[p])}">LLM 에 다시 묻기 · ${p}${p!=="midm"?" (유료)":""}</button>`).join(" ");
  const lanes=["호출","LLM","TTS","미션"].map(n=>{const es=d.events.filter(e=>e.lane===n);
    return `<div class=lane><div class=n>${n}</div><div>${es.map(e=>`<div class=ev>+${(e.t-d.start).toFixed(2)}s ${esc(e.kind)} ${esc(e.raw)}</div>`).join("")||'<span class=note>—</span>'}</div></div>`}).join("");
  $("right").innerHTML=`
  <div><b>${fmtT(d.start)}</b> · ${d.trigger==="wake"?"호출로 시작":"질문으로 시작"} · 마지막 사건까지 ${(d.last_t-d.start).toFixed(1)} s
   ${d.linked_by==="time"?'<span class=note>(질문 id 없음 — 시각으로 이은 추정 연결)</span>':""}</div>
  ${d.silent?`<div class=silent>${esc(d.silent)}</div>`:""}
  <div class=sec>설계상 대답 (추정) vs 실제</div>
  <div class=cmp><div class=box><h4>설계상 대답 (추정)</h4>${expBox(rule)}${reasked}
    <div style="margin-top:6px">${btns}</div>
    <div class=note>그때 경로: ${esc(then||"모름")} · 외부 경로는 누를 때마다 비용이 듭니다(결과는 캐시). 로컬은 주행 중 거부.</div><div id=reaskout></div></div>
   <div class=box><h4>실제 (이 장면의 로봇 말)</h4>${actual}<div class=note>받아쓴 말: ${esc(d.user_text||"없음")}</div></div></div>
  <div class=sec>원인</div>
  ${d.causes.map(c=>`<div class="cause ${sKey(c.status)}"><span class="badge s-${sKey(c.status)}">${esc(c.status)}</span><b>${esc(c.name)}</b>
    <div class=note>${esc(c.note)}</div>${c.evidence.map(x=>`<div class=ev>${esc(x)}</div>`).join("")}</div>`).join("")||'<div class=note>원인 줄 없음</div>'}
  <div class=sec>8단계</div>
  <div id=strip>${d.stages.map(s=>`<div class="stage st-${s.status}" title="${esc(s.why)}">${esc(s.name)}<small>${esc(s.why||{pass:"통과",broken:"끊김",estimate:"추정",none:"해당 없음"}[s.status])}</small></div>`).join("")}</div>
  <div class=note>초록 통과 · 빨강 끊김 · 주황 추정 · 회색 해당 없음/기록 없음</div>
  <div class=sec>소리 (±3 s)</div>
  ${d.clips.map(c=>`<div class=clipr>+${(c.t-d.start).toFixed(1)}s <b>${esc(c.result||c.kind)}</b>${c.score!=null?" 점수 "+c.score:""}${c.rms!=null?" rms "+c.rms:""} ${esc(c.text)}
    <audio controls preload=none src="/api/clip?file=${encodeURIComponent(c.file)}"></audio></div>`).join("")||'<div class=note>이 시각의 저장된 소리 없음</div>'}
  <div class=sec>시간축 (노드별, 마지막 사건까지)</div>${lanes}
  <details><summary>원문 로그 ${d.events.length}줄</summary><pre>${esc(d.events.map(e=>`${fmtT(e.t)}.${String(Math.round((e.t%1)*1000)).padStart(3,"0")} [${e.node}] ${e.raw}`).join("\n"))}</pre></details>`;
  $("right").querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>reask(d.id,b.dataset.p,b));
}
async function reask(id,p,btn){const out=$("reaskout");
  if(p!=="midm"&&!confirm(`${p} 는 외부 API 라 비용이 듭니다. 한 번 묻습니다.`))return;
  btn.disabled=true;out.innerHTML='<span class=note>묻는 중…</span>';
  try{const e=await j(`/api/reask/${encodeURIComponent(id)}?path=${p}&${q()}`,{method:"POST",headers:{"X-Scene-Viewer":"1"}});
    out.innerHTML=`<div class=clipr><b>${esc(p)}</b> ${expBox(e)}</div>`}
  catch(e){out.innerHTML=`<div class=err><b>${e.code===409?"거부됨":"실패"}</b>: ${esc(e.message)}</div>`}
  btn.disabled=false}
$("load").onclick=load;
const now=Date.now()/1000;$("until").value=local(now);$("since").value=local(now-86400);
</script></body></html>
